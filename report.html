<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Your Health Report - Bud</title>
<meta name="description" content="Your health report from the Bud assessment, and the 90-day plan built on your blood work.">
<meta name="theme-color" content="#f7f5f0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --ink: #12201b;
    --ink-2: #34433d;
    --muted: #6b7671;
    --hair: rgba(18, 32, 27, 0.11);
    --hair-2: rgba(18, 32, 27, 0.06);
    --green: #1f5f4f;
    --green-2: #174a3e;
    --band: #0f3a30;
    --band-ink: #eef4f1;
    --band-muted: rgba(238, 244, 241, 0.62);
    --band-hair: rgba(238, 244, 241, 0.14);
    /* Status: a fill and a lighter step of the same hue for its track, always
       paired with a word - never colour alone. */
    --good: #2e7d64;
    --good-t: #dbeae3;
    --fair: #b58222;
    --fair-t: #f2e6cc;
    --warn: #b5523a;
    --warn-t: #f3ded6;
    --sans: Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Instrument Serif", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100svh; background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  body.locked { overflow: hidden; }
  a { color: inherit; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }
  svg.i { width: 20px; height: 20px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 28px; }
  .label { font: 600 11.5px/1 var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .serif { font-family: var(--serif); font-weight: 400; }

  /* ---------- top ---------- */
  .top { position: sticky; top: 0; z-index: 20; background: rgba(247, 245, 240, 0.9); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); }
  .top .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .logo { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font: 700 19px/1 var(--sans); letter-spacing: -0.02em; }
  .logo svg { width: 26px; height: 26px; }
  .exit { font: 600 14px/1 var(--sans); color: var(--muted); text-decoration: none; }
  .exit:hover { color: var(--ink); }

  /* ---------- buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; padding: 0 26px; border: 0; border-radius: 100px; background: var(--green); color: #fff; font: 600 15.5px/1.2 var(--sans); text-decoration: none; cursor: pointer; transition: background-color .2s ease, transform .2s ease; }
  .btn:hover { background: var(--green-2); }
  .btn:active { transform: scale(0.99); }
  .btn:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
  .btn:disabled { opacity: 0.55; cursor: progress; }
  .btn svg { width: 17px; height: 17px; }
  .btn-block { width: 100%; }
  .btn-quiet { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--hair); }
  .btn-quiet:hover { background: #fff; }
  .link { color: var(--green); font-weight: 600; text-decoration: none; }
  .link:hover { text-decoration: underline; }

  /* ---------- hero ---------- */
  .hero { padding-top: 56px; }
  .hero h1 { margin: 0; max-width: 15ch; font: 400 clamp(42px, 6.2vw, 72px)/1.0 var(--serif); letter-spacing: -0.015em; }
  .hero p { margin: 20px 0 0; max-width: 46ch; color: var(--ink-2); font-size: 18px; line-height: 1.55; }

  .panel { display: grid; grid-template-columns: 280px 1fr; margin-top: 44px; border: 1px solid var(--hair); border-radius: 24px; background: var(--surface); }
  .score { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 36px 28px; border-right: 1px solid var(--hair-2); text-align: center; }
  .ring { position: relative; width: 168px; height: 168px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 5; }
  .ring .arc { stroke-linecap: round; transition: stroke-dashoffset 1.4s cubic-bezier(.2, .7, .2, 1); }
  .ring-n { position: absolute; inset: 0; display: grid; place-content: center; }
  .ring-n b { font: 600 56px/1 var(--sans); letter-spacing: -0.04em; }
  .ring-n span { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .score .label { margin-top: 18px; }
  .state { display: inline-flex; align-items: center; gap: 7px; margin-top: 8px; font: 600 15px/1.2 var(--sans); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .dot.good { background: var(--good); } .dot.fair { background: var(--fair); } .dot.warn { background: var(--warn); }

  .areas { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 44px; align-content: center; margin: 0; padding: 36px 40px; list-style: none; }
  .area-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .area-top b { font: 600 15.5px/1.2 var(--sans); }
  .area-top span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .bar { position: relative; height: 4px; margin-top: 12px; border-radius: 4px; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 4px; transition: width 1.2s cubic-bezier(.2, .7, .2, 1); }
  .bar.good { background: var(--good-t); } .bar.good i { background: var(--good); }
  .bar.fair { background: var(--fair-t); } .bar.fair i { background: var(--fair); }
  .bar.warn { background: var(--warn-t); } .bar.warn i { background: var(--warn); }

  /* ---------- sections ---------- */
  .sec { padding-top: 96px; }
  .sec h2 { margin: 14px 0 0; font: 400 clamp(34px, 4.4vw, 48px)/1.04 var(--serif); letter-spacing: -0.01em; }
  .sec .lede { margin: 14px 0 0; max-width: 54ch; color: var(--ink-2); font-size: 17px; }

  .sigs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 36px; }
  .sig { padding: 24px 24px 26px; border: 1px solid var(--hair); border-radius: 20px; background: var(--surface); }
  .sig-top { display: flex; align-items: center; gap: 12px; }
  .sig-top svg { width: 22px; height: 22px; color: var(--green); }
  .sig-top h3 { flex: 1; margin: 0; font: 600 17px/1.25 var(--sans); letter-spacing: -0.01em; }
  .hi { display: inline-flex; align-items: center; gap: 6px; font: 600 11px/1 var(--sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--warn); white-space: nowrap; }
  .sig p { margin: 14px 0 0; color: var(--ink-2); font-size: 15px; line-height: 1.55; }
  .sig .care { margin-top: 10px; color: #8a3b28; font-size: 14px; }
  .nothing { margin-top: 32px; max-width: 60ch; color: var(--ink-2); font-size: 17px; }
  .note { display: flex; gap: 12px; margin-top: 18px; max-width: 72ch; color: var(--ink-2); font-size: 15px; }
  .note svg { color: var(--green); margin-top: 2px; }

  /* ---------- the plan ---------- */
  .band { margin-top: 104px; padding: 88px 0; background: var(--band); color: var(--band-ink); }
  .band .label { color: var(--band-muted); }
  .band h2 { margin: 14px 0 0; max-width: 17ch; font: 400 clamp(36px, 4.6vw, 52px)/1.03 var(--serif); letter-spacing: -0.01em; }
  .plan { display: grid; grid-template-columns: minmax(0, 1fr) 430px; gap: 64px; align-items: start; }
  .steps { margin: 40px 0 0; padding: 0; list-style: none; counter-reset: s; }
  .steps li { position: relative; display: grid; grid-template-columns: 34px 1fr; gap: 16px; padding: 18px 0; border-top: 1px solid var(--band-hair); counter-increment: s; }
  .steps li:last-child { border-bottom: 1px solid var(--band-hair); }
  .steps li::before { content: counter(s); width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; border: 1px solid rgba(238, 244, 241, 0.3); font: 600 12.5px/1 var(--sans); color: var(--band-ink); }
  .steps b { display: block; font: 600 16.5px/1.35 var(--sans); }
  .steps span { display: block; margin-top: 3px; color: var(--band-muted); font-size: 14.5px; }
  .doc { display: flex; align-items: center; gap: 16px; margin-top: 32px; }
  .doc img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; flex: 0 0 auto; background: rgba(238, 244, 241, 0.1); box-shadow: 0 0 0 1px var(--band-hair); }
  .doc b { display: block; color: var(--band-ink); font: 600 16.5px/1.3 var(--sans); }
  .doc small { display: block; margin-top: 2px; color: var(--band-muted); font-size: 13.5px; }
  .doc span { display: block; margin-top: 6px; color: var(--band-muted); font-size: 14.5px; line-height: 1.45; }

  .price { padding: 30px; border-radius: 24px; background: var(--surface); color: var(--ink); box-shadow: 0 30px 60px -40px rgba(0, 0, 0, 0.6); }
  .price h3 { margin: 0; font: 600 17px/1.3 var(--sans); }
  .incl { margin: 6px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; text-wrap: balance; }
  .opts { display: grid; gap: 10px; margin-top: 18px; }
  .opt { position: relative; display: block; padding: 18px 18px 18px 52px; border: 1px solid var(--hair); border-radius: 16px; cursor: pointer; transition: border-color .2s ease, background-color .2s ease; }
  .opt:hover { border-color: rgba(31, 95, 79, 0.45); }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt .tick { position: absolute; left: 18px; top: 21px; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid rgba(18, 32, 27, 0.28); }
  .opt .tick::after { content: ""; position: absolute; inset: 3.5px; border-radius: 50%; background: var(--green); transform: scale(0); transition: transform .2s cubic-bezier(.2, .8, .2, 1.4); }
  .opt.on { border-color: var(--green); background: #f3f8f5; box-shadow: inset 0 0 0 1px var(--green); }
  .opt.on .tick { border-color: var(--green); }
  .opt.on .tick::after { transform: scale(1); }
  .opt input:focus-visible + .tick { outline: 2px solid var(--green); outline-offset: 2px; }
  .opt-title { display: block; font: 600 15.5px/1.35 var(--sans); }
  .opt-title span { white-space: nowrap; }
  .opt-sub { display: block; margin-top: 3px; color: var(--muted); font-size: 13.5px; line-height: 1.45; text-wrap: pretty; }
  .opt-price { display: block; margin-top: 10px; white-space: nowrap; }
  .opt-price s { margin-right: 6px; color: var(--muted); font-size: 13px; }
  .opt-price strong { font: 700 19px/1 var(--sans); letter-spacing: -0.02em; }
  .opt-price small { color: var(--muted); font-size: 12.5px; }
  .offer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--hair-2); font-size: 13.5px; color: var(--muted); }
  .offer b { color: var(--warn); font-weight: 600; }
  .total { display: flex; align-items: baseline; justify-content: space-between; margin-top: 10px; }
  .total span { color: var(--muted); font-size: 14px; }
  .total strong { font: 700 24px/1 var(--sans); letter-spacing: -0.02em; }
  .price .btn { margin-top: 18px; }
  .proof { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px; font: 600 13.5px/1.3 var(--sans); }
  .proof svg { width: 17px; height: 17px; color: var(--green); }
  .talk h3 { margin: 0; font: 400 30px/1.1 var(--serif); }
  .talk p { margin: 12px 0 0; color: var(--ink-2); font-size: 15px; }
  .talk .btn { margin-top: 22px; }

  /* ---------- questions ---------- */
  .faq { max-width: 760px; margin-top: 28px; border-top: 1px solid var(--hair); }
  .faq details { border-bottom: 1px solid var(--hair); }
  .faq summary { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 0; cursor: pointer; list-style: none; font: 600 17px/1.4 var(--sans); }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary svg { color: var(--muted); transition: transform .25s ease; }
  .faq details[open] summary svg { transform: rotate(45deg); }
  .faq details p { margin: -6px 0 22px; max-width: 64ch; color: var(--ink-2); font-size: 15.5px; }

  .foot { margin-top: 104px; padding: 28px 0 112px; border-top: 1px solid var(--hair); color: var(--muted); font-size: 13px; }
  .foot .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }
  .foot nav { display: flex; gap: 18px; }
  .foot a { text-decoration: none; }
  .foot a:hover { color: var(--ink); }

  /* ---------- sticky bar ---------- */
  .sticky { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--hair); transform: translateY(110%); transition: transform .35s cubic-bezier(.2, .7, .2, 1); }
  .sticky.show { transform: none; }
  .sticky .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .sticky s { margin-right: 6px; color: var(--muted); font-size: 13px; }
  .sticky strong { font: 700 19px/1 var(--sans); letter-spacing: -0.02em; }
  .sticky small { color: var(--muted); font-size: 13px; }
  .sticky .btn { min-height: 46px; padding: 0 22px; font-size: 15px; }

  /* ---------- checkout ---------- */
  .veil { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 20px; background: rgba(10, 24, 20, 0.42); animation: fade .2s ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .sheet { position: relative; width: 100%; max-width: 520px; max-height: calc(100svh - 40px); overflow-y: auto; border-radius: 24px; background: var(--bg); box-shadow: 0 40px 90px -40px rgba(0, 0, 0, 0.55); animation: rise .35s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes rise { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet form { padding: 30px 30px 26px; }
  .close { position: absolute; right: 18px; top: 18px; width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 50%; background: #fff; cursor: pointer; }
  .sheet h2 { margin: 0; padding-right: 44px; font: 400 34px/1.05 var(--serif); }
  .sheet .lede { margin: 8px 0 0; color: var(--ink-2); font-size: 15px; }
  .chosen { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; padding: 14px 16px; border: 1px solid var(--hair); border-radius: 14px; background: #fff; font-size: 14.5px; }
  .chosen strong { font-size: 17px; }
  .field { margin-top: 14px; }
  .field label { display: block; margin-bottom: 6px; font: 600 13px/1.3 var(--sans); color: var(--ink-2); }
  .input { width: 100%; min-height: 50px; padding: 12px 14px; border: 1px solid var(--hair); border-radius: 12px; background: #fff; color: var(--ink); font: 500 16px/1.4 var(--sans); transition: border-color .2s ease, box-shadow .2s ease; }
  textarea.input { min-height: 78px; resize: vertical; }
  .input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(31, 95, 79, 0.12); }
  .input.bad { border-color: var(--warn); }
  .row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .err { margin: 6px 0 0; color: #9a3a24; font: 600 12.5px/1.3 var(--sans); }
  .sheet .btn { margin-top: 22px; }
  .form-err { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; background: #fbeae5; color: #8a3221; font: 600 13.5px/1.45 var(--sans); }
  .secure { display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 12px; color: var(--muted); font-size: 12.5px; }
  .secure svg { width: 14px; height: 14px; }
  .terms { margin: 6px 0 0; text-align: center; color: var(--muted); font-size: 12px; }

  /* ---------- after payment ---------- */
  .done { max-width: 640px; padding-top: 64px; }
  .done-ico { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 50%; background: var(--green); color: #fff; }
  .done-ico svg { width: 24px; height: 24px; stroke-width: 2.2; }
  .done h1 { margin: 26px 0 0; font: 400 clamp(40px, 6vw, 60px)/1.02 var(--serif); letter-spacing: -0.015em; }
  .done > p { margin: 14px 0 0; color: var(--ink-2); font-size: 17px; }
  .receipt { display: flex; justify-content: space-between; gap: 16px; margin-top: 26px; padding: 16px 0; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); font-size: 15px; }
  .receipt span { color: var(--muted); }
  .book { margin-top: 30px; padding: 28px; border: 1px solid var(--hair); border-radius: 22px; background: #fff; }
  .book h2 { margin: 0; font: 600 20px/1.3 var(--sans); }
  .book > p { margin: 6px 0 0; color: var(--ink-2); font-size: 15px; }
  .pick { margin-top: 18px; }
  .pick > span { display: block; margin-bottom: 8px; font: 600 13px/1.3 var(--sans); color: var(--ink-2); }
  .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .days::-webkit-scrollbar { display: none; }
  .chipb { flex: 0 0 auto; min-width: 68px; padding: 10px 12px; border: 1px solid var(--hair); border-radius: 12px; background: #fff; font: 600 14px/1.25 var(--sans); text-align: center; cursor: pointer; }
  .chipb small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
  .chipb[aria-pressed="true"] { border-color: var(--green); background: var(--green); color: #fff; }
  .chipb[aria-pressed="true"] small { color: rgba(255, 255, 255, 0.75); }
  .wins { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .wins .chipb { min-height: 50px; }
  .next { margin: 26px 0 0; padding: 0; list-style: none; }
  .next li { display: flex; gap: 12px; padding: 10px 0; color: var(--ink-2); font-size: 15px; }
  .next li b { width: 22px; flex: 0 0 auto; color: var(--muted); font-weight: 600; }
  .wait { display: flex; align-items: center; gap: 12px; margin-top: 24px; color: var(--ink-2); }
  .spin { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--hair); border-top-color: var(--green); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { max-width: 560px; padding-top: 96px; }
  .empty h1 { margin: 0; font: 400 clamp(38px, 5vw, 52px)/1.05 var(--serif); }
  .empty p { margin: 14px 0 0; color: var(--ink-2); font-size: 17px; }
  .empty .btn { margin-top: 26px; }

  .preview { position: fixed; right: 16px; top: 76px; z-index: 30; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 100px; background: #fff8dc; border: 1px solid #e6cf86; font: 600 12px/1 var(--sans); color: #6b5512; box-shadow: 0 8px 20px -12px rgba(0, 0, 0, 0.35); }
  .preview a { color: inherit; }
  .sticky.show ~ .preview, body.locked .preview { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media (max-width: 920px) {
    .plan { grid-template-columns: minmax(0, 1fr); gap: 40px; }
    .price { order: -1; }
    .sigs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 720px) {
    .panel { grid-template-columns: minmax(0, 1fr); }
    .score { border-right: 0; border-bottom: 1px solid var(--hair-2); }
  }
  @media (max-width: 640px) {
    .wrap { padding: 0 20px; }
    .hero { padding-top: 36px; }
    .hero p { font-size: 16.5px; }
    .areas { grid-template-columns: minmax(0, 1fr); gap: 22px; padding: 28px 24px; }
    .sec { padding-top: 72px; }
    .sigs { grid-template-columns: minmax(0, 1fr); }
    .band { margin-top: 80px; padding: 64px 0; }
    .price { padding: 22px; }
    .opt { padding: 16px 14px 16px 46px; }
    .opt .tick { left: 14px; top: 19px; }
    .veil { padding: 0; place-items: end center; }
    .sheet { max-height: 94svh; border-radius: 24px 24px 0 0; }
    .sheet form { padding: 26px 20px 22px; }
    .row2 { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .book { padding: 22px 18px; }
    .sticky small { display: none; }
    .preview { top: auto; bottom: 84px; right: 12px; }
  }
</style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="/" aria-label="Bud home">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 29V14.5" stroke="#12201b" stroke-width="2.6" stroke-linecap="round"/><path d="M16 17c0-5.6-3.4-9.7-9.8-10.6C5.3 13 8.5 17 16 17Z" fill="#25705c"/><path d="M16 14.6c.6-4.7 3.8-8 9.4-8C25.4 13 22.1 14.6 16 14.6Z" fill="#25705c" fill-opacity="0.6"/></svg>
        Bud

      if (known('calcium')) { pts += 5; lines.push('You’ve been told your calcium was low before.'); }
      if (has('conditions', 'bone')) { pts += 3; lines.push('Low bone density makes calcium a priority.'); }
      if (a.diet === 'vegan') { pts += 3; lines.push('A vegan diet has no dairy, the main source of calcium for most people.'); }
      if (menopause) { pts += 2; lines.push('Calcium needs rise after menopause.'); }
      if (femaleish && age !== null && age >= 45) pts += 1;
      sig('Calcium', 'milk', pts, lines);
    })();

    (function () {
      var pts = 0, lines = [];
      if (known('folate')) { pts += 5; lines.push('You’ve been told your folate was low before.'); }
      if (femaleish && a.pregnancy === 'trying') { pts += 3; lines.push('Folate matters before and during pregnancy.'); }
      sig('Folate', 'leaf', pts, lines);
    })();

    var shown = sigs.filter(function (s) { return s.pts >= 3; })
      .sort(function (x, y) { return y.pts - x.pts; })
      .slice(0, 6)
      .map(function (s) { s.high = s.pts >= 6; return s; });

    return {
      first: firstName(a.name),
      areas: areas, score: score, scoreStatus: scoreStatus, scoreWord: scoreWord,
      signals: shown,
      pregnant: femaleish && anyOf('pregnancy', ['pregnant', 'breastfeeding']),
      breastfeeding: femaleish && a.pregnancy === 'breastfeeding',
      abroad: a.country && a.country !== 'india',
      recentTest: a.prior_tests === 'lt3m'
    };
  }

  function animate() {
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        main.querySelectorAll('.arc').forEach(function (c) { c.style.strokeDashoffset = c.getAttribute('data-to'); });
        main.querySelectorAll('.bar i').forEach(function (i) { i.style.width = i.getAttribute('data-w') + '%'; });
      });
    });
    main.querySelectorAll('[data-count]').forEach(function (b) {
      var to = +b.getAttribute('data-count');
      if (reduce) { b.textContent = to; return; }
      var t0 = null;
      (function step(t) {
        if (!t0) t0 = t;
        var p = Math.min(1, (t - t0) / 1300);
        b.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(step);
      })(performance.now());
    });
  }

  // The bar shows once the score panel is out of view and hides while the
  // price card is on screen.
  var io = null;
  function watchSticky() {
    if (io) io.disconnect();
    stickyEl.classList.remove('show');
    if (!stickyEl.innerHTML || !('IntersectionObserver' in window)) return;
    var top = main.querySelector('.panel'), price = document.getElementById('price');
    var seen = { top: true, price: false };
    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.target === top) seen.top = e.isIntersecting; if (e.target === price) seen.price = e.isIntersecting; });
      var show = !seen.top && !seen.price;
      stickyEl.classList.toggle('show', show);
      stickyEl.setAttribute('aria-hidden', show ? 'false' : 'true');
    }, { threshold: 0.05 });
    if (top) io.observe(top);
    if (price) io.observe(price);
  }

  }

  function showErrors(f, errs, general) {
    f.querySelectorAll('.err').forEach(function (e) { e.remove(); });
    f.querySelectorAll('.input').forEach(function (e) { e.classList.remove('bad'); e.removeAttribute('aria-invalid'); });
    var keys = Object.keys(errs);
    keys.forEach(function (k) {
      var input = f.elements[k];
      input.classList.add('bad');
      input.setAttribute('aria-invalid', 'true');
      f.querySelector('[data-f="' + k + '"]').insertAdjacentHTML('beforeend', '<p class="err">' + esc(errs[k]) + '</p>');
    });
    f.querySelector('#form-err').innerHTML = general ? '<p class="form-err" role="alert">' + esc(general) + '</p>' : '';
    if (keys.length) f.elements[keys[0]].focus();
  }

  function readForm(f) {
    var v = {};
    ['name', 'phone', 'address', 'pincode', 'city', 'state'].forEach(function (k) { v[k] = (f.elements[k].value || '').trim(); });
    var errs = {};
    if (v.name.length < 2) errs.name = FIELD_ERRORS.bad_name[1];
    if (v.phone.replace(/\D/g, '').length < 10) errs.phone = FIELD_ERRORS.bad_phone[1];
    if (v.address.length < 10) errs.address = FIELD_ERRORS.bad_address[1];
    if (!/^[1-9][0-9]{5}$/.test(v.pincode)) errs.pincode = FIELD_ERRORS.bad_pincode[1];
    if (v.city.length < 2) errs.city = FIELD_ERRORS.bad_city[1];
    if (!v.state) errs.state = FIELD_ERRORS.bad_state[1];
    showErrors(f, errs, '');
    return Object.keys(errs).length ? null : v;
  }

  function submitCheckout(ev) {
    ev.preventDefault();
    var f = ev.target, v = readForm(f);
    if (!v) return;
    var key = chosen();
    r.plan = key;
    r.contact = v;
    keep();
    var btn = f.querySelector('#pay');
    if (!API || !aid) {
      // A local preview has no server to pay through: show what comes after.
      r.purchase = { plan: key, amount: total(key), link: 'preview', preview: true };
      keep();
      closeCheckout();
      renderPaid();
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Opening Razorpay…';
    post('/plan/checkout', { id: aid, plan: key, contact: v }).then(function (res) {
      if (res.ok && res.data.url) {
        r.pending = { link: res.data.link, plan: key, amount: res.data.amount_inr };
        keep();
        location.href = res.data.url;
        return;
      }
      if (res.ok && res.data.status === 'paid') {
        r.purchase = { plan: res.data.plan || key, amount: res.data.amount_inr, link: res.data.link, slot: res.data.slot || null };
        keep();
        closeCheckout();
        renderPaid();
        return;
      }
      btn.disabled = false;
      btn.textContent = 'Pay ' + inr(total(key));
      var code = res.data && res.data.detail;
      if (FIELD_ERRORS[code]) { var e = {}; e[FIELD_ERRORS[code][0]] = FIELD_ERRORS[code][1]; showErrors(f, e, ''); return; }
      showErrors(f, {}, GENERAL_ERRORS[code] || (res.status === 429 ? 'Too many tries. Wait a few minutes and try again.' : 'Something went wrong. Check your connection and try again.'));
    });
  }

  function dayList() {
    var out = [], d = new Date();
    for (var i = 1; i <= 7; i++) {
      var x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + i);
      out.push({ v: x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'),
                 wd: x.toLocaleDateString('en-IN', { weekday: 'short' }), dm: x.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) });
    }
    return out;
  }
  function dayWords(v) {
    var p = String(v || '').split('-');
    return p.length === 3 ? new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' }) : v;
  }
  var WINDOWS = { '7-9': '7–9 AM', '9-11': '9–11 AM' };

  function renderPaid() {
    var p = r.purchase, key = PLANS[p.plan] ? p.plan : 'test';
    var name = firstName((r.contact || {}).name || a.name);
    var book;
    if (key === 'test' && p.slot) {
      book = '<div class="book"><h2>Your slot request is in</h2><p>' + esc(dayWords(p.slot.day)) + ', ' + esc(WINDOWS[p.slot.window] || p.slot.window) +
        '. We’ll confirm the exact time on WhatsApp.</p>' +
        '<p style="margin-top:16px"><button type="button" class="link" data-act="change-slot" style="border:0;background:none;padding:0;cursor:pointer;font:inherit">Change it</button></p></div>';
    } else if (key === 'test') {
      var draft = r.slotDraft || {};
      book = '<div class="book"><h2>Book your home blood test</h2><p>Pick a day and a morning window. It’s usually done fasting.</p>' +
        '<div class="pick"><span>Day</span><div class="days" role="group" aria-label="Day">' + dayList().map(function (d) {
          return '<button type="button" class="chipb" data-act="pick-day" data-v="' + d.v + '" aria-label="' + esc(dayWords(d.v)) + '" aria-pressed="' + (draft.day === d.v) + '">' + esc(d.wd) + '<small>' + esc(d.dm) + '</small></button>';
        }).join('') + '</div></div>' +
        '<div class="pick"><span>Window</span><div class="wins" role="group" aria-label="Window">' + Object.keys(WINDOWS).map(function (w) {
          return '<button type="button" class="chipb" data-act="pick-win" data-v="' + w + '" aria-pressed="' + (draft.window === w) + '">' + WINDOWS[w] + '</button>';
        }).join('') + '</div></div>' +
        '<div class="field"><label for="f-saddress">Address</label><textarea class="input" id="f-saddress" maxlength="300">' +
          esc(draft.address || [((r.contact || {}).address), (r.contact || {}).city, (r.contact || {}).pincode].filter(Boolean).join(', ')) + '</textarea></div>' +
        '<div id="slot-err"></div>' +
        '<button type="button" class="btn btn-block" data-act="slot" style="margin-top:18px">Request this slot</button></div>';
    } else {
      book = '<div class="book"><h2>Send us your blood report</h2><p>It must be from the last 3 months. Send the PDF or clear photos on WhatsApp and we’ll check it has the markers your doctor needs.</p>' +
        '<a class="btn" style="margin-top:18px" href="' + waTeam('Hi, here’s my blood report for my Bud 90-day plan.') + '">Send my report on WhatsApp</a></div>';
    }
    var steps = (key === 'test'
      ? ['We confirm your blood test slot on WhatsApp.', 'Your doctor reads your report and prescribes your supplements.', 'Day 0 with your nutritionist, and Bud starts with you on WhatsApp.']
      : ['We check your report has what your doctor needs.', 'Your doctor reads it and prescribes your supplements.', 'Day 0 with your nutritionist, and Bud starts with you on WhatsApp.']);
    main.innerHTML = '<section class="wrap done">' +
      '<span class="done-ico">' + ico('check') + '</span>' +
      '<h1>You’re in' + (name ? ', ' + esc(name) : '') + '.</h1>' +
      '<p>Payment received for your 90‑day plan.' + (p.preview ? ' (Preview: no payment was taken.)' : '') + '</p>' +
      '<div class="receipt"><span>' + esc(PLANS[key].order) + '</span><b>' + inr(p.amount || total(key)) + '</b></div>' +
      book +
      '<ol class="next">' + steps.map(function (t, i) { return '<li><b>' + (i + 1) + '</b><span>' + esc(t) + '</span></li>'; }).join('') + '</ol>' +
      '<p style="margin-top:22px"><a class="link" href="#" data-act="back-to-report">Back to your report</a></p>' +
    '</section>' + footer() + previewPill();
    stickyEl.innerHTML = '';
    stickyEl.classList.remove('show');
    window.scrollTo(0, 0);
  }

  function requestSlot(btn) {
    var p = r.purchase, d = r.slotDraft || {};
    var addr = (document.getElementById('f-saddress') || {}).value || '';
    var errBox = document.getElementById('slot-err');
    var problem = !d.day ? 'Pick a day.' : !d.window ? 'Pick a window.' : addr.trim().length < 10 ? 'Add the address for the visit.' : '';
    errBox.innerHTML = problem ? '<p class="form-err" role="alert">' + esc(problem) + '</p>' : '';
    if (problem) return;
    d.address = addr.trim();
    if (!API || p.preview) {
      p.slot = { day: d.day, window: d.window };
      keep();
      renderPaid();
      return;
    }
    btn.disabled = true;
    post('/plan/slot', { id: aid, link: p.link, day: d.day, window: d.window, address: d.address }).then(function (res) {
      btn.disabled = false;
      if (res.ok && res.data.slot) { p.slot = res.data.slot; keep(); renderPaid(); return; }
      var code = res.data && res.data.detail;
      errBox.innerHTML = '<p class="form-err" role="alert">' + esc({ bad_day: 'Pick a day in the next week.', bad_window: 'Pick a window.', bad_address: 'Add the address for the visit.' }[code] || 'Something went wrong. Try again in a minute.') + '</p>';
    });
  }

  // ======================================================================
  // Events
  // ======================================================================

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    if (act === 'checkout') { ev.preventDefault(); openCheckout(); }
    else if (act === 'close') closeCheckout();
    else if (act === 'close-bg') { if (ev.target === t) closeCheckout(); }
    else if (act === 'pick-day' || act === 'pick-win') {
      r.slotDraft = r.slotDraft || {};
      r.slotDraft[act === 'pick-day' ? 'day' : 'window'] = t.getAttribute('data-v');
      var ta = document.getElementById('f-saddress');
      if (ta) r.slotDraft.address = ta.value;
      keep();
      t.parentNode.querySelectorAll('.chipb').forEach(function (b) { b.setAttribute('aria-pressed', b === t ? 'true' : 'false'); });
    }
    else if (act === 'slot') requestSlot(t);
    else if (act === 'change-slot') { delete r.purchase.slot; keep(); renderPaid(); }
    else if (act === 'recheck') { renderConfirming(); confirmPaid(4); }
    else if (act === 'retry') { delete r.pending; keep(); renderReport(); }
    else if (act === 'back-to-report') { ev.preventDefault(); if (r.purchase && r.purchase.preview) delete r.purchase; keep(); renderReport(); window.scrollTo(0, 0); }
  });

  document.addEventListener('change', function (ev) {
    if (ev.target.name !== 'plan') return;
    r.plan = ev.target.value;
    keep();
    document.querySelectorAll('.opt').forEach(function (o) { o.classList.toggle('on', o.querySelector('input').checked); });
    var key = chosen();
    var tot = document.getElementById('total'), sv = document.getElementById('save');
    if (tot) tot.textContent = inr(total(key));
    if (sv) sv.textContent = 'You save ' + inr(saving(key));
    sticky();
  });

  document.addEventListener('keydown', function (ev) {
    if (!sheetRoot.innerHTML) return;
    if (ev.key === 'Escape') closeCheckout();
    if (ev.key === 'Tab') {
      var f = sheetRoot.querySelectorAll('button, input, select, textarea, a[href]');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
    }
  });

  // ======================================================================
  // Start
  // ======================================================================

  if (!a) {
    var mid = saved && !saved.done && saved.answers && Object.keys(saved.answers).length;
    main.innerHTML = '<section class="wrap empty"><h1>' + (mid ? 'Finish your assessment first' : 'Your report starts with the assessment') + '</h1>' +
      '<p>' + (mid ? 'You’re part-way through. Finish it and your report appears here.' : 'Answer a few questions and your report appears here straight away.') + '</p>' +
      '<a class="btn" href="/assessment">' + (mid ? 'Continue the assessment' : 'Start the assessment') + ico('arrow') + '</a></section>';
    return;
  }
  R = buildReport();
  if (r.purchase) {
    renderPaid();
    // Bring a paid order up to date with the server (a slot set elsewhere).
    if (API && aid && !r.purchase.preview) post('/plan/confirm', { id: aid, link: r.purchase.link }).then(function (res) {
      if (res.ok && res.data.status === 'paid') { r.purchase.slot = res.data.slot || r.purchase.slot || null; keep(); renderPaid(); }
    });
  } else if (r.pending && r.pending.link && API) {
    renderConfirming();
    confirmPaid(0);
  } else {
    renderReport();
  }
})();
</script>
</body>
</html>
