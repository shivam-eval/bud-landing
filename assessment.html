<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Your Personal Health Assessment - Bud</title>
<meta name="description" content="Answer a few questions about your lifestyle, nutrition and health history so Bud can understand your needs.">
<link rel="canonical" href="https://mybud.life/assessment">
<meta name="theme-color" content="#f6f5f1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --brand: #25705c;
    --brand-700: #1d5a4a;
    --brand-900: #0e3128;
    --brand-50: #eef5f2;
    --brand-100: #dbeae4;
    --paper: #f6f5f1;
    --ink: #0f1f1a;
    --muted: #5d6965;
    --line: rgba(15, 31, 26, 0.12);
    --sans: Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Instrument Serif", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100svh;
    background:
      radial-gradient(900px 500px at 100% -10%, rgba(37, 112, 92, 0.08), transparent 60%),
      var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  a { color: inherit; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }

  /* ---------- Top bar ---------- */
  .a-top {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(246, 245, 241, 0.86);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .a-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    max-width: 1180px;
    margin: 0 auto;
    padding: 18px 24px;
  }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    text-decoration: none;
    font: 700 20px/1 var(--sans);
    letter-spacing: -0.02em;
  }
  .logo svg { width: 28px; height: 28px; }
  .a-section {
    font: 600 13px/1.2 var(--sans);
    color: var(--muted);
    text-align: center;
    flex: 1;
  }
  .a-exit {
    padding: 9px 16px;
    border: 1px solid var(--line);
    border-radius: 100px;
    background: #fff;
    text-decoration: none;
    font: 600 13px/1 var(--sans);
  }
  .a-exit:hover { border-color: var(--brand); color: var(--brand); }
  .a-progress { height: 4px; background: rgba(15, 31, 26, 0.07); }
  .a-progress i {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #4ca084, var(--brand));
    border-radius: 0 4px 4px 0;
    transition: width .6s cubic-bezier(.2, .7, .2, 1);
  }

  /* ---------- Stage ---------- */
  main {
    flex: 1;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    padding: clamp(32px, 6vw, 64px) 24px 140px;
  }
  .step { animation: stepIn .5s cubic-bezier(.2, .7, .2, 1) both; }
  .step.back { animation-name: stepBack; }
  @keyframes stepIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes stepBack { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: none; } }

  .q-count {
    display: flex;
    align-items: center;
    gap: 10px;
    font: 700 12px/1 var(--sans);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--brand);
  }
  .q-count span { color: var(--muted); font-weight: 600; }
  .q-count .q-sec { display: none; text-transform: none; letter-spacing: 0; font-size: 12.5px; }
  .q-title {
    margin: 14px 0 0;
    font: 600 clamp(26px, 3.6vw, 36px)/1.15 var(--sans);
    letter-spacing: -0.03em;
  }
  .q-help { margin: 12px 0 0; color: var(--muted); font: 500 15px/1.55 var(--sans); }
  .q-note {
    margin: 14px 0 0;
    padding: 12px 14px;
    border-radius: 14px;
    background: var(--brand-50);
    color: var(--brand-900);
    font: 500 14px/1.5 var(--sans);
  }

  /* options */
  .opts { display: grid; gap: 10px; margin-top: 28px; }
  .opts.two { grid-template-columns: 1fr 1fr; }
  .opt {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 18px;
    border: 1.5px solid var(--line);
    border-radius: 16px;
    background: #fff;
    text-align: left;
    font: 600 15.5px/1.35 var(--sans);
    cursor: pointer;
    transition: border-color .2s ease, background-color .2s ease, transform .15s ease, box-shadow .2s ease;
  }
  .opt:hover { border-color: rgba(37, 112, 92, 0.5); }
  .opt:active { transform: scale(0.99); }
  .opt:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .opt .ind {
    position: relative;
    width: 22px;
    height: 22px;
    flex: 0 0 auto;
    border: 1.5px solid rgba(15, 31, 26, 0.3);
    border-radius: 50%;
    transition: background-color .2s ease, border-color .2s ease;
  }
  .opt.multi .ind { border-radius: 7px; }
  .opt .ind::after {
    content: "";
    position: absolute;
    left: 6.5px;
    top: 3px;
    width: 5px;
    height: 10px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) scale(0);
    transition: transform .2s cubic-bezier(.2, .8, .2, 1.4);
  }
  .opt[aria-checked="true"] {
    border-color: var(--brand);
    background: var(--brand-50);
    box-shadow: 0 10px 24px -18px rgba(37, 112, 92, 0.8);
  }
  .opt[aria-checked="true"] .ind { background: var(--brand); border-color: var(--brand); }
  .opt[aria-checked="true"] .ind::after { transform: rotate(45deg) scale(1); }
  .opt.disabled { opacity: 0.45; cursor: not-allowed; }

  /* fields */
  .field { margin-top: 18px; }
  .field > label, .field .flabel {
    display: block;
    margin-bottom: 8px;
    font: 700 13px/1.3 var(--sans);
    color: var(--ink);
  }
  .input, .select, textarea.input {
    width: 100%;
    min-height: 54px;
    padding: 14px 16px;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    background: #fff;
    color: var(--ink);
    font: 500 16px/1.4 var(--sans);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  textarea.input { min-height: 110px; resize: vertical; }
  .input:focus, .select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(37, 112, 92, 0.12); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .phone-row .select { flex: 0 0 116px; }
  .dob-row .input { text-align: center; }
  .dob-row .y { flex: 1.5; }
  .follow {
    margin-top: 18px;
    padding: 18px;
    border-radius: 18px;
    background: #fff;
    border: 1px solid var(--line);
    animation: stepIn .4s cubic-bezier(.2, .7, .2, 1) both;
  }
  .follow .field:first-child { margin-top: 0; }
  .follow .opts { margin-top: 10px; }
  .other-wrap { margin-top: 10px; }
  .sub { margin-top: 28px; }
  .sub h3 { margin: 0 0 4px; font: 700 15px/1.3 var(--sans); }
  .sub .opts { margin-top: 12px; }

  .unit-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .unit-head .flabel { margin: 0; }
  .seg { display: inline-flex; padding: 3px; border-radius: 100px; background: rgba(15, 31, 26, 0.06); }
  .seg button {
    padding: 7px 13px;
    border: 0;
    border-radius: 100px;
    background: none;
    font: 600 12.5px/1 var(--sans);
    color: var(--muted);
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08); }
  .unsure { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; font: 500 14px/1.3 var(--sans); color: var(--muted); cursor: pointer; }
  .unsure input { width: 18px; height: 18px; accent-color: var(--brand); }
  .err { margin: 14px 0 0; color: #b4472f; font: 600 14px/1.4 var(--sans); }

  /* ---------- Bottom nav ---------- */
  .a-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    background: linear-gradient(0deg, var(--paper) 70%, rgba(246, 245, 241, 0));
  }
  .a-nav-in {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    max-width: 680px;
    margin: 0 auto;
    padding: 22px 24px 26px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 52px;
    padding: 6px 6px 6px 24px;
    border: 0;
    border-radius: 100px;
    font: 600 15px/1.2 var(--sans);
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    transition: transform .2s ease, background-color .2s ease, opacity .2s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--brand); color: #fff; box-shadow: 0 10px 28px -14px rgba(37, 112, 92, 0.9); }
  .btn-primary:hover { background: var(--brand-700); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-arrow {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #fff;
    color: var(--brand);
  }
  .btn-arrow svg { width: 16px; height: 16px; }
  .btn-ghost {
    padding: 0 20px;
    background: transparent;
    border: 1.5px solid var(--line);
    color: var(--ink);
  }
  .btn-ghost:hover { border-color: var(--brand); color: var(--brand); }
  .btn-text { padding: 0 6px; background: none; color: var(--muted); }
  .btn-text:hover { color: var(--brand); }
  .btn-plain { padding: 0 24px; }
  .kbd-hint { color: var(--muted); font: 500 12.5px/1 var(--sans); }
  .nav-err {
    max-width: 632px;
    margin: 0 auto -6px;
    padding: 10px 14px;
    border-radius: 12px;
    background: #fbeae5;
    color: #9a3a24;
    font: 600 13.5px/1.4 var(--sans);
  }
  .kbd-hint b { font-weight: 700; color: var(--ink); }

  /* ---------- Intro / notice / done ---------- */
  .intro-banner {
    position: relative;
    height: 200px;
    border-radius: 26px;
    overflow: hidden;
    background: #dfe3df url("/img/hero-misty-hills.jpg") center 65% / cover no-repeat;
  }
  .intro-banner::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(246, 245, 241, 0.1), rgba(9, 34, 27, 0.35));
  }
  .intro-banner span {
    position: absolute;
    left: 24px;
    bottom: 18px;
    z-index: 1;
    padding: 8px 14px;
    border-radius: 100px;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font: 700 12px/1 var(--sans);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--brand);
  }
  .intro h1 {
    margin: 30px 0 0;
    font: 600 clamp(34px, 5vw, 50px)/1.04 var(--sans);
    letter-spacing: -0.04em;
  }
  .intro h1 em { font: italic 400 1.1em/1 var(--serif); color: var(--brand); letter-spacing: -0.01em; }
  .intro .lead { margin: 16px 0 0; font: 600 19px/1.4 var(--sans); }
  .intro p { margin: 12px 0 0; color: var(--muted); font: 500 16px/1.65 var(--sans); }
  .intro .disclaim {
    margin-top: 22px;
    padding: 16px 18px;
    border-radius: 16px;
    background: #fff;
    border: 1px solid var(--line);
    display: flex;
    gap: 12px;
    font: 500 14px/1.55 var(--sans);
    color: var(--muted);
  }
  .disclaim svg { width: 20px; height: 20px; flex: 0 0 auto; color: var(--brand); margin-top: 1px; }
  .intro-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 30px; }

  .notice {
    padding: clamp(26px, 5vw, 40px);
    border-radius: 26px;
    background: #fff;
    border: 1px solid var(--line);
  }
  .notice-ico, .done-ico {
    width: 56px;
    height: 56px;
    display: grid;
    place-items: center;
    border-radius: 18px;
    background: var(--brand-50);
    color: var(--brand);
  }
  .notice-ico svg { width: 28px; height: 28px; }
  .notice h2, .done h2 {
    margin: 22px 0 0;
    font: 600 clamp(26px, 3.6vw, 34px)/1.15 var(--sans);
    letter-spacing: -0.03em;
  }
  .notice p, .done p { margin: 14px 0 0; color: var(--muted); font: 500 16px/1.65 var(--sans); }
  .notice .actions, .done .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }

  .done { text-align: center; padding-top: 20px; }
  .done-ico {
    width: 84px;
    height: 84px;
    margin: 0 auto;
    border-radius: 50%;
    background: var(--brand);
    color: #fff;
    animation: pop .7s cubic-bezier(.2, .9, .3, 1.4) both;
  }
  .done-ico svg { width: 38px; height: 38px; }
  .done-ico path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .5s ease .45s forwards; }
  .done p { max-width: 520px; margin-left: auto; margin-right: auto; }
  .done .sign { margin-top: 26px; font: italic 400 22px/1.3 var(--serif); color: var(--brand); }
  .done .actions { justify-content: center; }
  @keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .done-ico path { stroke-dashoffset: 0; }
  }
  @media (max-width: 640px) {
    .a-section { display: none; }
    .q-count { flex-wrap: wrap; gap: 6px 10px; }
    .q-count .q-sec { display: inline; }
    .opts.two { grid-template-columns: 1fr; }
    .opt { padding: 15px 16px; font-size: 15px; }
    .kbd-hint { display: none; }
    .a-nav-in { padding: 18px 16px 20px; }
    main { padding-left: 18px; padding-right: 18px; }
    .intro-banner { height: 150px; }
  }
</style>
</head>
<body>
  <header class="a-top">
    <div class="a-bar">
      <a class="logo" href="/" aria-label="Bud home">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 29V14.5" stroke="#0f1f1a" stroke-width="2.6" stroke-linecap="round"/><path d="M16 17c0-5.6-3.4-9.7-9.8-10.6C5.3 13 8.5 17 16 17Z" fill="#25705c"/><path d="M16 14.6c.6-4.7 3.8-8 9.4-8C25.4 13 22.1 14.6 16 14.6Z" fill="#25705c" fill-opacity="0.6"/></svg>

  <main id="stage" aria-live="polite"></main>

  <nav class="a-nav" id="a-nav" hidden>

  </nav>

<script>

  function o(v, l, extra) { var x = { v: v, l: l }; if (extra) for (var k in extra) x[k] = extra[k]; return x; }

  function ageOf(a) {

  // ---------- The steps, in order. `show` hides a step unless it applies. ----------
  var STEPS = [
    { id: 'contact', sec: 0, type: 'contact', req: true,

    { id: 'dob', sec: 0, type: 'dob', req: true, meta: 'Required · Date input',

    { id: 'stop_age', type: 'stop', show: function (a) { var g = ageOf(a); return g !== null && g < 18; } },

        body.appendChild(ow);
        if (picked !== false) setTimeout(function () { var x = ow.querySelector('input'); if (x && !x.value) x.focus(); }, 30);
      }
      // conditional follow-ups
      (step.follow || []).forEach(function (fu) {
        if (!fu.when(a)) return;
        var box = el('div', { class: 'follow' });
        if (fu.type === 'text') box.appendChild(textField(fu.key, fu.label, { placeholder: fu.placeholder, maxlength: 200 }));
        else if (fu.type === 'textarea') box.appendChild(textField(fu.key, fu.label, { area: true, maxlength: 1500 }));
        else if (fu.type === 'single') {
          box.appendChild(el('span', { class: 'flabel' }, esc(fu.label)));
          box.appendChild(singleGroup(fu.key, fu.options, function () { rebuild(false); }));
        } else if (fu.type === 'multi') {
          box.appendChild(el('span', { class: 'flabel' }, esc(fu.label)));
          box.appendChild(multiGroup(fu.key, fu.options, {}, function () { rebuild(false); }));
        }
        body.appendChild(box);
      });
      refreshNav();
    }
    rebuild(false);
    return w;
  }

  function hwFields() {
    var wrap = el('div');
    var us = a.country === 'us';
    var h = a.height || (a.height = { unit: us ? 'ft' : 'cm' });
    var w = a.weight || (a.weight = { unit: us ? 'lb' : 'kg' });

    function block(label, obj, units, draw) {
      var f = el('div', { class: 'field' });
      var head = el('div', { class: 'unit-head' });
      head.appendChild(el('span', { class: 'flabel' }, label));
      var seg = el('div', { class: 'seg', role: 'group', 'aria-label': label + ' unit' });
      units.forEach(function (u) {
        var b = el('button', { type: 'button', 'aria-pressed': obj.unit === u[0] ? 'true' : 'false' }, u[1]);
        b.addEventListener('click', function () { obj.unit = u[0]; save(); redraw(); });
        seg.appendChild(b);
      });
      head.appendChild(seg);
      f.appendChild(head);
      var inputs = el('div', { class: 'row' });
      draw(inputs);
      f.appendChild(inputs);
      var lab = el('label', { class: 'unsure' });
      var cb = el('input', { type: 'checkbox' });
      cb.checked = !!obj.unknown;
      cb.addEventListener('change', function () { obj.unknown = cb.checked; save(); redraw(); });
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode('I don\'t know'));
      f.appendChild(lab);
      if (obj.unknown) inputs.querySelectorAll('input').forEach(function (i) { i.disabled = true; });
      return f;
    }
    function num(obj, key, ph, aria) {
      var i = el('input', { class: 'input', inputmode: 'decimal', placeholder: ph, 'aria-label': aria, maxlength: 5 });
      i.value = obj[key] || '';
      i.addEventListener('input', function () { i.value = i.value.replace(/[^\d.]/g, ''); obj[key] = i.value; save(); refreshNav(); });
      return i;
    }
    function redraw() {
      wrap.innerHTML = '';
      wrap.appendChild(block('Height', h, [['cm', 'cm'], ['ft', 'ft & in']], function (row) {
        if (h.unit === 'ft') { row.appendChild(num(h, 'ft', 'ft', 'Feet')); row.appendChild(num(h, 'in', 'in', 'Inches')); }
        else row.appendChild(num(h, 'cm', 'cm', 'Height in centimetres'));
      }));
      wrap.appendChild(block('Weight', w, [['kg', 'kg'], ['lb', 'lbs']], function (row) {
        row.appendChild(num(w, 'v', w.unit === 'lb' ? 'lbs' : 'kg', 'Weight'));
      }));
      refreshNav();
    }
    redraw();
    return wrap;
  }

  // ---------- Navigation ----------
  function current() { return state.done ? null : stepById(state.at); }

  function refreshNav() {
    var s = current();
    if (!s || s.type === 'stop') return;
    if (s.type === 'notice') { nextBtn.disabled = false; nextLabel.textContent = 'Continue the assessment'; return; }
    var vis = visible();
    var last = vis[vis.length - 1] === s;
    nextBtn.disabled = !valid(s);
    nextLabel.textContent = last ? 'Submit' : (!s.req && !answered(s) ? 'Skip' : 'Next');
  }

  function updateChrome() {
    var s = current();
    var onIntro = !state.done && state.at === 'intro';
    nav.hidden = onIntro || state.done || (s && s.type === 'stop');
    var qs = questions();
    var pct = 0;
    if (state.done) pct = 100;
    else if (s) {
      var idx = qs.indexOf(s);
      if (idx === -1) { var vis = visible(); for (var i = vis.indexOf(s); i >= 0; i--) { if (qs.indexOf(vis[i]) > -1) { idx = qs.indexOf(vis[i]); break; } } }
      pct = Math.round(((Math.max(idx, 0) + (s.sec !== undefined ? 0 : 1)) / qs.length) * 100);
    }
    bar.style.width = pct + '%';
    bar.parentNode.setAttribute('aria-valuenow', String(pct));
    if (s && s.sec !== undefined) secLabel.textContent = 'Section ' + (s.sec + 1) + ' of ' + SECTIONS.length + ' · ' + SECTIONS[s.sec];
    else if (state.done) secLabel.textContent = 'Complete';
    else secLabel.textContent = onIntro ? 'Health assessment' : '';
    backBtn.style.visibility = onIntro ? 'hidden' : 'visible';
    refreshNav();
  }

  function go(id, dir) {
    state.at = id; state.resumeAt = id; save(); render(dir);
    // Saved on every step once name and phone are in, so somebody who stops
    // halfway is still somebody Bud can reach. A failed partial save is not
    // shown: the next step (or Submit) sends everything again.
    if (!dir) sync(false);
  }

  function next() {
    clearTimeout(autoTimer);
    var s = current();
    if (!s || (s.type !== 'notice' && !valid(s))) return;
    var vis = visible();
    var i = vis.indexOf(s);
    if (i === vis.length - 1) return finish();
    go(vis[i + 1].id);
  }

  function back() {
    clearTimeout(autoTimer);
    var s = current();
    var vis = visible();
    var i = vis.indexOf(s);
    if (i <= 0) { state.at = 'intro'; save(); return render('back'); }
    go(vis[i - 1].id, 'back');
  }

  var sending = false;
  function finish() {
    if (sending) return;
    sending = true;
    showError('');
    nextBtn.disabled = true;
    nextLabel.textContent = 'Sending…';
    sync(true).then(function (ok) {
      sending = false;
      if (!ok) {
        refreshNav();
        showError('We couldn\'t send your answers. Check your connection and press Submit again.');
        return;
      }
      state.done = true;
      save();
      render();
    });
  }

  // ---------- Saving to Bud ----------
  // On mybud.life the answers go to Bud's server. Anywhere else (a local
  // preview, a deploy preview) the server would refuse the origin, so nothing
  // is sent and the flow carries on as if it had been.
  var LIVE = /(^|\.)mybud\.life$/.test(location.hostname);
  var API = 'https://api.mybud.life/assessment';

  function newId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    var b = new Uint8Array(16);
    (window.crypto || window.msCrypto).getRandomValues(b);
    b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    var h = Array.prototype.map.call(b, function (x) { return (x + 256).toString(16).slice(1); }).join('');
    return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
  }

  function contactGiven() { return valid(stepById('contact')); }

  function sync(completed) {
    if (!contactGiven()) return Promise.resolve(false);
    if (!state.aid) { state.aid = newId(); save(); }
    var qs = questions();
    var s = current();
    var n = completed ? qs.length : Math.max(qs.indexOf(s) + 1, 1);
    var body = JSON.stringify({
      id: state.aid,
      name: (a.name || '').trim(),
      phone_code: a.phone_code || '+91',
      phone: (a.phone || '').trim(),
      answers: buildAnswers(),
      step: completed ? 'submitted' : (s && s.id) || '',
      progress: { n: n, total: qs.length },
      completed: !!completed
    });
    if (!LIVE) return Promise.resolve(true);
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: body,
      keepalive: body.length < 60000
    }).then(function (res) { return res.ok; }).catch(function () { return false; });
  }

  // What they have answered so far, from the questions that apply to them -
  // an answer to a question that no longer applies (they changed their sex,
  // or their diet) is left out rather than sent.
  function buildAnswers() {
    var out = {};
    visible().forEach(function (s) {
      if (s.type === 'contact' || s.sec === undefined) return;
      if (s.type === 'hw') { out.height = a.height; out.weight = a.weight; }
      else if (s.type === 'pair') s.parts.forEach(function (p) { if (filled(a[p.key])) out[p.key] = a[p.key]; });
      else if (a[s.id] !== undefined) out[s.id] = a[s.id];
      if (s.other && has(a, s.id, 'other')) out[s.other] = a[s.other];
      (s.follow || []).forEach(function (f) { if (f.when(a) && a[f.key] !== undefined) out[f.key] = a[f.key]; });
    });
    return out;
  }

  var navErr = document.getElementById('nav-err');
  function showError(text) { navErr.textContent = text; navErr.hidden = !text; }

  // Leaving mid-way (closing the tab, switching app) saves where they are.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && !state.done && current() && current().sec !== undefined) sync(false);
  });

  nextBtn.addEventListener('click', next);
  backBtn.addEventListener('click', back);
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' || ev.shiftKey || ev.isComposing) return;
    if (ev.target && ev.target.tagName === 'TEXTAREA') return;
    if (ev.target && ev.target.tagName === 'BUTTON' && ev.target !== nextBtn) return;
    if (nav.hidden || nextBtn.disabled) return;
    ev.preventDefault();
    next();
  });

  render();
})();
</script>
</body>
</html>
